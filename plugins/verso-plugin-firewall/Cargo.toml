[package]
name = "verso-plugin-firewall"
version = "0.1.0"
edition = "2021"

[dependencies]
verso-plugin = { path = "../verso-plugin-sdk" }
# The root half reads nft's JSON; the page tests assert on the serialized
# envelope, which is the contract the shell decodes.
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
